# Argus plugins.yaml —— Hub 全局插件声明（design §12）
# 唯一能声明 cli 二进制 / remote endpoint 的地方；仓库的 .reviewagents.yaml 只能"选"不能"增"。
#
# 字段说明：
#   name/kind       kind ∈ builtin | cli | remote
#   protocol        kind=remote 时：a2a | mcp
#   skills          requirement-compliance | code-review | visual-check（R4 按 skill 分派）
#   needs           diff | repo-file-read | working-copy | requirement-spec | preview-url
#   lockRepoConfig  仓库配置不可禁用/排除（§3.4 红线 3，默认含安全类）
#   skillRefs       方法论注入（§9.1），从 ARGUS_SKILLS_DIR/<name>/SKILL.md 解析
#   cost            fast | standard | heavy（token 预算吃紧时 heavy 先裁，锁定插件豁免）
#   timeout         插件单次执行超时
#   enabled         缺省 true
#   cmd/mode        kind=cli：白名单可执行文件（§8 供应链信任）；mode= full | delegate
#   endpoint        kind=remote：仅此处可声明

agents:
  # ---- builtin：进程内 Eino ADK agent ----
  - name: requirement-compliance        # 整条 R1→R5 workflow 包成的插件
    kind: builtin
    skills: [requirement-compliance]
    needs: [diff, repo-file-read, requirement-spec]
    lockRepoConfig: true
    skillRefs: [ocr-grading]            # OCR SKILL.md 的评分标准注入 R3（白嫖阿里分级）
    cost: heavy
    timeout: 600s

  - name: correctness
    kind: builtin
    skills: [code-review]
    needs: [diff, repo-file-read]
    cost: standard
    timeout: 120s

  - name: security
    kind: builtin
    skills: [code-review]
    needs: [diff, repo-file-read]
    lockRepoConfig: true                # 审查对象不得关闭对自己的安全审查
    cost: heavy
    timeout: 120s

  # ---- remote：OCR（open-code-review）经 ocrshim MCP 通道（推荐主路径）----
  # ocrshim（cmd/ocrshim）为 argus 同主机 sidecar：收 payload.workcopy_dir 后在
  # 目录内执行 OCR 并归一化 findings；OCR 的 LLM 凭证配在 ocrshim 侧
  # （OCRSHIM_OCR_ENV），不再透传进 argus 进程。
  - name: ocr
    kind: remote
    protocol: mcp
    skills: [code-review]
    needs: [working-copy]               # argus 备工作副本，目录经 payload 下发
    endpoint: "http://ocrshim:8090/mcp" # compose 服务名互通；工作副本卷须与 argus 共享
    tool: review
    cost: heavy
    timeout: 300s                       # 须 < ocrshim -timeout（shim 侧硬上限 10m）
    enabled: true                       # 本文件随 compose 部署（sidecar 在场）；镜像默认的 plugins.example.yaml 是关闭的
    # 可选鉴权：.env 里设 OCRSHIM_TOKEN=<随机串>（env_file 已注入 ocrshim 容器，
    # shim 侧读到即自动启用 Bearer 门），再取消下一行注释配对 argus 侧。
    # compose 跨容器 endpoint 不在 loopback 上，建议开启：
    # auth_token_env: OCRSHIM_TOKEN

  # ---- cli：OCR 回退通道（默认关闭；上游 v1.12+ 无 diff 子命令，见 example 注释）----
  - name: ocr-cli
    kind: cli
    skills: [code-review]
    needs: [working-copy]
    cmd: ["/opt/argus/bin/ocr", "review", "--format", "json"]
    mode: full
    cost: heavy
    timeout: 300s
    enabled: false

  # ---- remote：远端 agent（v3.0 接口位，v3.1 实装协议子集）----
  - name: review-service                # 生产 review-service 的 MCP server（§3.5 对接通道 B）
    kind: remote
    protocol: mcp
    skills: [code-review]
    endpoint: "http://review-service.svc/mcp"
    cost: standard
    timeout: 180s
    enabled: false                      # endpoint 就绪后打开

  - name: frontend-visual               # 前端视觉 agent 接口位：填 endpoint 即插
    kind: remote
    protocol: a2a
    skills: [visual-check]
    needs: [preview-url]
    enabled: false
