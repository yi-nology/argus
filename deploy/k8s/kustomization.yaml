apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argus

resources:
  - 00-namespace.yaml
  - 01-secret.yaml          # ⚠️ 部署前必改占位凭证（或删掉本条改用 kubectl create secret）
  - 02-configmap.yaml
  - 03-pvc.yaml
  - 04-deployment.yaml
  - 05-plugins-configmap.yaml
  - 06-service.yaml
  # - 07-ingress.yaml.example  # 可选，按需启用后取消注释

images:
  - name: argus
    newTag: v3.9.1          # 推 Harbor 后改为 harbor.example.com/enjoydream/argus:v3.9.1
