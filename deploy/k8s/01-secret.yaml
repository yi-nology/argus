# ⚠️ 部署前必改：以下为占位凭证，填入真实值（或改用 kubectl create secret，见 deploy/README.md）。
# 注意：本文件含敏感信息，切勿提交真实凭证到 git。
apiVersion: v1
kind: Secret
metadata:
  name: argus-secret
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
type: Opaque
stringData:
  ARGUS_APITOKEN: "change-me"
  ARGUS_GITEA_TOKEN: "gto_xxxxxxxxxxxx"
  ARGUS_GITEA_SECRET: "webhook-sign-secret"
  OPENAI_BASE_URL: "https://api.example.com/v1"
  OPENAI_API_KEY: "sk-xxxx"
  OPENAI_MODEL: "mimo-v2.5-pro"
  # GitHub App 认证（替代 PAT；三者全配时启用，TOKEN 可省略）
  # 参见 docs/github-app-setup.md 获取完整配置指南
  ARGUS_GITHUB_APP_ID: ""
  ARGUS_GITHUB_APP_PRIVATE_KEY: ""
  ARGUS_GITHUB_APP_INSTALLATION_ID: ""
  # 结果上报 sink（v3.9.0，可选；配合 02-configmap 的 ARGUS_SINK_URL 注释项）
  # ARGUS_SINK_TOKEN: "change-me-argus-ingest-token"
