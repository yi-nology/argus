# ⚠️ 部署前必改：以下为占位凭证，填入真实值（或改用 kubectl create secret，见 deploy/README.md）。
# 注意：本文件含敏感信息，切勿提交真实凭证到 git。
apiVersion: v1
kind: Secret
metadata:
  name: argus-secret
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
type: Opaque
stringData:
  ARGUS_APITOKEN: "change-me"
  ARGUS_GITEA_TOKEN: "gto_xxxxxxxxxxxx"
  ARGUS_GITEA_SECRET: "webhook-sign-secret"
  OPENAI_BASE_URL: "https://api.example.com/v1"
  OPENAI_API_KEY: "sk-xxxx"
  OPENAI_MODEL: "gpt-4o-mini"
