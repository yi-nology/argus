apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: argus
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - secretRef:
            name: {{ .Values.existingSecret }}
        {{- /* Phase1④（spec §2.4）：迁移 Job 先行执行 DDL 后，业务 Pod 只校验
             不迁移——开启 migrationJob 且用户未在 config 显式设置时自动注入
             verify（K8s env 后者覆盖前者，显式手配优先）。 */}}
        {{- $injectVerify := and .Values.migrationJob.enabled (not (hasKey .Values.config "ARGUS_MIGRATE_MODE")) }}
        {{- if or .Values.config $injectVerify }}
        env:
        {{- if $injectVerify }}
        - name: ARGUS_MIGRATE_MODE
          value: "verify"
        {{- end }}
        {{- range $k, $v := .Values.config }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: work
          mountPath: /data/work
        - name: data
          mountPath: /home/argus/.opencodereview
          subPath: ocr-home
        - name: plugins
          mountPath: /app/plugins.yaml
          subPath: plugins.yaml
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "argus.fullname" .)) }}
      - name: work
        emptyDir:
          sizeLimit: {{ .Values.workDiskSize }}
      - name: plugins
        configMap:
          name: {{ .Values.pluginsConfigMap }}
