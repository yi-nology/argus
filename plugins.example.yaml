# Argus plugins.yaml —— Hub 全局插件声明（design §12）
# 唯一能声明 cli 二进制 / remote endpoint 的地方；仓库的 .reviewagents.yaml 只能"选"不能"增"。
#
# 字段说明：
#   name/kind       kind ∈ builtin | cli | remote
#   protocol        kind=remote 时：a2a | mcp
#   skills          requirement-compliance | code-review | visual-check（R4 按 skill 分派）
#   needs           diff | repo-file-read | working-copy | requirement-spec | preview-url
#   lockRepoConfig  仓库配置不可禁用/排除（§3.4 红线 3，默认含安全类）
#   skillRefs       方法论注入（§9.1），从 ARGUS_SKILLS_DIR/<name>/SKILL.md 解析
#   cost            fast | standard | heavy（token 预算吃紧时 heavy 先裁，锁定插件豁免）
#   timeout         插件单次执行超时
#   reviewN         best-of-N 同质采样次数（v3.10.0；缺省 1 = 关闭，上限 5）。>1 时同一
#                   插件并发跑 N 次：复现 ≥2 的发现升一级严重度并标注「采样复现 k/n」，
#                   仅单次出现的 low 意见标注「单次采样」。高危路径 opt-in，成本 ×N
#                   （token 记账逐采样累计）。复现计数是确定性指纹匹配，不经任何模型。
#   enabled         缺省 true
#   cmd/mode        kind=cli：白名单可执行文件（§8 供应链信任）；mode= full | delegate
#   endpoint        kind=remote：仅此处可声明

agents:
  # ---- builtin：进程内 Eino ADK agent ----
  - name: requirement-compliance        # 整条 R1→R5 workflow 包成的插件
    kind: builtin
    skills: [requirement-compliance]
    needs: [diff, repo-file-read, requirement-spec]
    lockRepoConfig: true
    skillRefs: [ocr-grading]            # OCR SKILL.md 的评分标准注入 R3（白嫖阿里分级）
    cost: heavy
    timeout: 600s

  - name: correctness
    kind: builtin
    skills: [code-review]
    needs: [diff, repo-file-read]
    cost: standard
    timeout: 120s

  - name: security
    kind: builtin
    skills: [code-review]
    needs: [diff, repo-file-read]
    lockRepoConfig: true                # 审查对象不得关闭对自己的安全审查
    cost: heavy
    timeout: 120s
    # reviewN: 3                        # 高危路径 best-of-N 示例：3 次采样投票，
    #                                   # 复现 ≥2 的发现升级严重度（v3.10.0，成本 ×3）

  # ---- remote：OCR（open-code-review）经 ocrshim MCP 通道（推荐主路径）----
  # OCR 官方只有 MCP 客户端方向（消费外部工具），被 MCP 调用须经 ocrshim
  # （cmd/ocrshim）：streamable HTTP server，收 payload.workcopy_dir 后在目录内
  # 执行 `ocr review --from origin/<base> --to HEAD` 并归一化 findings。
  # 部署形态：argus 同主机 sidecar（共享工作副本卷）；OCR 的 LLM 凭证配在
  # ocrshim 侧（OCRSHIM_OCR_ENV 白名单），不再透传进 argus 进程。
  - name: ocr
    kind: remote
    protocol: mcp
    skills: [code-review]
    needs: [working-copy]               # argus 备工作副本，目录经 payload 下发
    # triggers.events 示例（SDK 归一化词表：cr.opened/cr.synchronize/cr.synchronized/cr.reopened）
    # 如只在首次打开时跑 OCR，取消注释下一行即可（v3.0.1 起生效）：
    # triggers: {events: [cr.opened]}
    endpoint: "http://127.0.0.1:8090/mcp"   # sidecar 同主机；容器部署填 ocrshim 服务地址
    tool: review
    cost: heavy
    timeout: 300s                       # 须 < ocrshim -timeout（shim 侧硬上限 10m）
    # 默认关闭（v3.9.0 审查修复）：本文件是镜像默认 /app/plugins.yaml，未部署
    # ocrshim sidecar 的裸跑形态下 remote 端点没有启动期校验——启用着会每个 PR
    # connection refused、报告挂降级说明、白烧熔断额度。部署了 sidecar 的
    # compose/k8s 配置里显式 enabled: true。
    enabled: false
    # 可选鉴权（与对端 ocrshim 的 -auth-token / OCRSHIM_TOKEN 配对）：
    # auth_token_env: OCRSHIM_TOKEN     # argus 进程环境里的共享密钥变量名

  # ---- cli：外部命令行（OCR 回退通道，默认关闭）----
  # 保留作回退位。当前上游（v1.12+）已无 `diff` 子命令且 range 审查需 --from/--to
  # 基准分支，静态 argv 无法表达——仅当 pin 的旧版本确有对应子命令时临时启用。
  - name: ocr-cli
    kind: cli
    skills: [code-review]
    needs: [working-copy]
    cmd: ["/opt/argus/bin/ocr", "review", "--format", "json"]
    # env: cli 子进程按名透传的额外变量（缺省最小环境，绝不继承 ARGUS_*/OPENAI_* 等密钥——
    # cli 在待审仓库的工作树里执行）。OCR 需要访问 LLM API 时在此显式声明：
    env: [OPENAI_API_KEY, OPENAI_BASE_URL]
    mode: full                          # full = OCR 全权审查（插件只支持 full；delegate 已由 runner 前置实装，见下）
    cost: heavy
    timeout: 300s
    enabled: false

  # ---- OCR delegate 委托前置（v3.9.0，成本最低的推荐通道）----
  # 不经插件：只要 OCR 的确定性工程（`delegate preview` 文件分诊 + `delegate rule`
  # 仓库规则组），审查 LLM 循环由 argus builtin 独家执行——OCR 端零 LLM、零凭证，
  # 省一份 LLM 配置与双份审查成本。配置环境变量即启用：
  #   ARGUS_OCR_BIN=/opt/argus/bin/ocr   （绝对路径，§8 供应链纪律）
  #   ARGUS_OCR_TIMEOUT=90s              （可选，单条命令硬上限）
  # 未配置或执行失败自动告警降级，审查照常。三通道取舍：delegate（本项，零 LLM）
  # > ocr remote/mcp（上项，OCR 自带审查 agent 的 findings 并入合议）> ocr-cli（回退位）。

  # ---- SAST 确定性前置（v3.15.0，与 OCR delegate 同范式：不经 plugins.yaml，env 启用）----
  # gitleaks / semgrep 在工作副本上扫描，findings 零 LLM 直进 Merger（密钥泄漏可
  # 直接驱动 R5.2 一票否决）。供应链纪律同 cli 插件：bin 只来自服务级 env，仓库
  # 配置不可启用/替换；gitleaks 全程 --redact 且密钥原文绝不进意见。
  #   ARGUS_SAST_GITLEAKS_BIN=/usr/local/bin/gitleaks    （缺省关）
  #   ARGUS_SAST_SEMGREP_BIN=/usr/local/bin/semgrep      （需同时配 CONFIG）
  #   ARGUS_SAST_SEMGREP_CONFIG=p/go                     （--config 值：路径/registry 名）
  #   ARGUS_SAST_TIMEOUT=120s                            （单工具硬上限，0 = 默认）

  # ---- remote：远端 agent（v3.1 实装：mcp = mark3labs/mcp-go streamable http client；
  #      a2a = Agent Card 发现 → message/send → tasks/get 轮询）----
  - name: review-service                # 生产 review-service 的 MCP server（§3.5 对接通道 B）
    kind: remote
    protocol: mcp
    skills: [code-review]
    endpoint: "http://review-service.svc/mcp"
    tool: create_review                 # 要调用的 MCP 工具名（缺省 review）
    cost: standard
    timeout: 180s
    enabled: false                      # endpoint 就绪后打开

  - name: frontend-visual               # 前端视觉 agent：填 endpoint 即插（A2A 子集：
    kind: remote                        # /.well-known/agent.json 发现 → 提交 → 轮询工件）
    protocol: a2a
    skills: [visual-check]
    needs: [preview-url]
    enabled: false

  # ---- acpx：CLI 编码 agent 作为审查专家（agentkit/acpx 驱动，v3.2）----
  # agent 词表：claude / zcode / codex / opencode / minimax / kimi / gemini / qwen / mimo
  # 前置条件：宿主机安装对应 CLI 并完成登录；未安装时插件自动停用（不影响启动）
  - name: coding-agent-codex
    kind: acpx
    agent: codex                        # 用哪个 CLI agent 审查
    skills: [code-review]
    needs: [diff, working-copy]         # 工作副本供 agent 查上下文（只读沙箱）
    cost: heavy
    timeout: 600s                       # 编码 agent 自主多轮，给足时长
    enabled: false                      # 装好 CLI 后打开

# ---- mcpServers：MCP server → agent 工具表（design §9.2 方向 A，v3.2）----
# 工具白名单 tools 段收敛暴露面：未声明的 server/工具不进 agent 工具表。
# headers 值支持 ${VAR} 环境引用（token 不落配置文件）。
