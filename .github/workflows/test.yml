name: Test

on:
  push:
    branches: [main, master]
  pull_request:

# 门禁口径单源在 Makefile：本文件只编排 job 与矩阵环境，不各自拼 go test 参数。
# 本地 `make test` / `make lint` / `make arch` / `make eval` 过 = 本流水线绿。
jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  # 静态门禁（企业级 CI 必过项）：vet + staticcheck + gofmt 三合一走 make lint，
  # 命令单源在 Makefile；钉版本安装，规则与本地 `make lint` 完全一致。
  lint:
    name: Lint (vet + staticcheck + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet + staticcheck + gofmt
        run: make lint

  # 可执行架构守卫（v3.62.0）：分层白名单 + 组合根单向性 + 包文档完整性。
  # 依赖方向变更必须先改 test/arch 白名单——CI 拦住未显式化的架构漂移。
  arch:
    name: Arch (layering + composition root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Architecture guards
        run: make arch

  # 生产方言（v6.1.7）：43 k8s 自 v5.4.8 起在役 PostgreSQL——矩阵必须覆盖。
  # 镜像与生产同款 postgres:16-alpine；DSN 接线 ARGUS_TEST_PG_DSN。
  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          ARGUS_TEST_PG_DSN: "postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable"
        run: make test

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: argus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          ARGUS_TEST_MYSQL_DSN: "root:test@tcp(127.0.0.1:3306)/argus_test?parseTime=true"
        run: make test

  golden-eval:
    name: Golden eval (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # G1a 评测门禁（v3.14.0）：打桩模式固化编排语义——R5 真值表/合并去重/
      # 反注入/证据门的回归必跑；真实模型 A/B 走独立定时工作流 eval-real.yml。
      # 注意 make eval 语义上覆盖了 test-sqlite 里的 TestGoldenReviewEval，
      # 独立成 job 是为了给分支保护一个可指名的必需检查项。
      - name: Run golden eval (stub, orchestration semantics)
        run: make eval
