name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 -timeout=300s ./...

  # 静态门禁（企业级 CI 必过项）：vet + staticcheck + gofmt 三合一走 make lint，
  # 命令单源在 Makefile；钉版本安装，规则与本地 `make lint` 完全一致。
  lint:
    name: Lint (vet + staticcheck + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: make vet

      - name: staticcheck + gofmt
        run: make lint

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: argus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          ARGUS_TEST_MYSQL_DSN: "root:test@tcp(127.0.0.1:3306)/argus_test?parseTime=true"
        run: go test -race -count=1 -timeout=300s ./...

  golden-eval:
    name: Golden eval (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # G1a 评测门禁（v3.14.0）：打桩模式固化编排语义——R5 真值表/合并去重/
      # 反注入/证据门的回归必跑；真实模型 A/B 走独立定时工作流 eval-real.yml。
      # 注意 make eval 语义上覆盖了 test-sqlite 里的 TestGoldenReviewEval，
      # 独立成 job 是为了给分支保护一个可指名的必需检查项。
      - name: Run golden eval (stub, orchestration semantics)
        run: make eval
