name: Pages

# 宣传页部署：web/（VuePress 2 站点源）构建 → GitHub Pages（upload-pages-artifact +
# deploy-pages 标准组合）。一次性前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署串行防重入；不腰斩（Pages 部署中途取消会留下半发布态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (vuepress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 站点源在 web/（README.md=首页，img/=真实回帖截图资产）；docs/ 其余内容是
      # 内部文档，不进 Pages。--ignore-scripts 拒绝安装期脚本执行（依赖评审条件：
      # @parcel/watcher 等 install script 默认不放行，构建已验证无需其编译产物）
      - name: Build site
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vuepress/dist

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
