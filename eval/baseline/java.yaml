      must_find:
        - kind: thread-safety
          severity: medium
  - id: java-008
    repo: acme/order-svc
    title: getter 命名规范化重命名
    label: known_fp
    source: 自行编写（合成夹具；known_fp 预设：历史误报形态）
    diff: |
      --- a/src/main/java/com/acme/order/Sku.java
      +++ b/src/main/java/com/acme/order/Sku.java
      @@ -6,3 +6,4 @@ public class Sku {
      -    public String getCode() { return code; }
      +    public String getCode() { return this.code; }
    expect:
      verdict: approve
      must_find: []
  - id: java-009
    repo: acme/inventory-svc
    title: 附件下载路径可穿越（历史漏检）
    label: known_miss
    source: 自行编写（合成夹具；known_miss 预设形态）
    diff: |
      --- a/src/main/java/com/acme/inv/AttachmentCtl.java
      +++ b/src/main/java/com/acme/inv/AttachmentCtl.java
      @@ -20,4 +20,6 @@ void download(HttpServletRequest req, HttpServletResponse resp) {
      +        String name = req.getParameter("name");
      +        resp.getOutputStream().write(Files.readAllBytes(Paths.get("/data/attach", name)));
    expect:
      verdict: request_changes
      must_find:
        - kind: path-traversal
          severity: high
  - id: java-010
