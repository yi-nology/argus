# Java 语言审查基准（P3-03 #28 起步集）。
#
# 出处口径（诚实标注，禁止把合成夹具说成现网已裁决 MR）：
#   - 本文件全部样例为**合成夹具**：自行编写的现实形态 Java diff（常见缺陷模式）；
#     现网在役仓的已裁决 MR 样例落地前，本文件不冒充现网数据。
#   - 标签口径与 go.yaml 同：known_miss/known_fp 是预设形态（结构约束由
#     LoadDir.Validate 硬校验），「历史模型漏报/误报」的实证归现网样例回填。
#
# kind 词表与真实模型评测协议（test/evalq/real_model_test.go）同闭集；匹配规则
# （kind 主键、file 可选收窄）见 docs/eval-baseline.md。
language: java
description: Java 语言审查基准（合成夹具起步集：常见缺陷模式自编写，非现网 MR）
cases:
  - id: java-001
    repo: acme/order-service
    title: JDBC 密码硬编码进源码
    label: standard
    source: 自编写合成夹具（现实形态 Java diff）
    diff: |
      diff --git a/src/main/java/com/acme/db/DataSourceConfig.java b/src/main/java/com/acme/db/DataSourceConfig.java
      --- a/src/main/java/com/acme/db/DataSourceConfig.java
      +++ b/src/main/java/com/acme/db/DataSourceConfig.java
      @@ -10,7 +10,7 @@ public class DataSourceConfig {
           public DataSource dataSource() {
               HikariConfig config = new HikariConfig();
               config.setJdbcUrl("jdbc:mysql://db.internal:3306/orders");
      -        config.setUsername(System.getenv("DB_USER"));
      +        config.setPassword("Orders@2026");
               config.setUsername(System.getenv("DB_USER"));
               return new HikariDataSource(config);
           }
    expect:
      verdict: request_changes
      must_find:
        - file: src/main/java/com/acme/db/DataSourceConfig.java
          kind: hardcoded-secret
          severity: high

  - id: java-002
    repo: acme/order-service
    title: IOException 被吞掉继续返回成功
    label: standard
    source: 自编写合成夹具（现实形态 Java diff）
    diff: |
      diff --git a/src/main/java/com/acme/io/ReportExporter.java b/src/main/java/com/acme/io/ReportExporter.java
      --- a/src/main/java/com/acme/io/ReportExporter.java
      +++ b/src/main/java/com/acme/io/ReportExporter.java
      @@ -22,8 +22,10 @@ public class ReportExporter {
           public boolean export(Path target, byte[] payload) {
               try (OutputStream out = Files.newOutputStream(target)) {
                   out.write(payload);
      -        } catch (IOException e) {
      -            throw new UncheckedIOException(e);
      +        } catch (IOException ignored) {
      +            // 忽略写入失败
           }
           return true;
       }
    expect:
      verdict: request_changes
      must_find:
        - file: src/main/java/com/acme/io/ReportExporter.java
          kind: error-swallow
          severity: high

  - id: java-003
    repo: acme/pay-gateway
    title: Statement 未关闭存在资源泄漏
    label: known_miss
    source: 自编写合成夹具（现实形态 Java diff）
    diff: |
      diff --git a/src/main/java/com/acme/pay/LedgerDao.java b/src/main/java/com/acme/pay/LedgerDao.java
      --- a/src/main/java/com/acme/pay/LedgerDao.java
      +++ b/src/main/java/com/acme/pay/LedgerDao.java
      @@ -30,9 +30,7 @@ public class LedgerDao {
           public List<Entry> fetchRecent(Connection conn) throws SQLException {
               Statement stmt = conn.createStatement();
               ResultSet rs = stmt.executeQuery("SELECT * FROM ledger ORDER BY id DESC LIMIT 100");
      -        List<Entry> out = new ArrayList<>();
      -        while (rs.next()) {
      -            out.add(mapRow(rs));
      -        }
      -        return out;
      +        // rs/stmt 由 GC 兜底回收
      +        return mapAll(rs);
           }
       }
    expect:
      verdict: request_changes
      must_find:
        - file: src/main/java/com/acme/pay/LedgerDao.java
          kind: resource-leak
          severity: medium

  - id: java-004
    repo: acme/pay-gateway
    title: 新增按关键字搜索用字符串拼接 SQL（引入注入面）
    label: standard
    source: 自编写合成夹具（现实形态 Java diff）
    diff: |
      diff --git a/src/main/java/com/acme/pay/SearchDao.java b/src/main/java/com/acme/pay/SearchDao.java
      --- a/src/main/java/com/acme/pay/SearchDao.java
      +++ b/src/main/java/com/acme/pay/SearchDao.java
      @@ -12,6 +12,12 @@ public class SearchDao {
               return mapAll(rs);
           }
      
      +    public List<Order> searchByMemo(Connection conn, String keyword) throws SQLException {
      +        String sql = "SELECT * FROM orders WHERE memo LIKE '%" + keyword + "%'";
      +        try (Statement stmt = conn.createStatement(); ResultSet rs = stmt.executeQuery(sql)) {
      +            return mapAll(rs);
      +        }
      +    }
       }
    expect:
      verdict: request_changes
      must_find:
        - file: src/main/java/com/acme/pay/SearchDao.java
          kind: sql-inject
          severity: high

  - id: java-005
    repo: acme/user-center
    title: equals 比较用 == 且缺 null 检查
    label: known_fp
    source: 自编写合成夹具（现实形态 Java diff；误报正例=干净 diff）
    diff: |
      diff --git a/src/main/java/com/acme/user/RoleChecker.java b/src/main/java/com/acme/user/RoleChecker.java
      --- a/src/main/java/com/acme/user/RoleChecker.java
      +++ b/src/main/java/com/acme/user/RoleChecker.java
      @@ -8,7 +8,7 @@ public class RoleChecker {
           private static final String ADMIN = "admin";
      
           public boolean isAdmin(String role) {
      -        return ADMIN.equals(role) && role.length() > 0;
      +        return ADMIN.equals(role) && !role.isBlank();
           }
       }
    expect:
      verdict: approve
