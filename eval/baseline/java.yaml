    diff: |
      --- a/src/main/java/com/acme/inv/Reserver.java
      +++ b/src/main/java/com/acme/inv/Reserver.java
      @@ -30,3 +30,5 @@ void reserve(Item it) {
      +        if (it == null) { return; }
               lock(it.getSku());
    expect:
