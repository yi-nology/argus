# Python 语言审查基准（P3-03 #28 起步集）。
#
# 出处口径（诚实标注，禁止把合成夹具说成现网已裁决 MR）：
#   - 本文件全部样例为**合成夹具**：自行编写的现实形态 Python diff（常见缺陷模式）；
#     现网在役仓的已裁决 MR 样例落地前，本文件不冒充现网数据。
#   - 标签口径与 go.yaml 同：known_miss/known_fp 是预设形态（结构约束由
#     LoadDir.Validate 硬校验），「历史模型漏报/误报」的实证归现网样例回填。
#
# kind 词表与真实模型评测协议（test/evalq/real_model_test.go）同闭集；匹配规则
# （kind 主键、file 可选收窄）见 docs/eval-baseline.md。
language: python
description: Python 语言审查基准（合成夹具起步集：常见缺陷模式自编写，非现网 MR）
cases:
  - id: py-001
    repo: acme/etl-pipeline
    title: API Token 明文写进源码
    label: standard
    source: 自编写合成夹具（现实形态 Python diff）
    diff: |
      diff --git a/pipeline/client.py b/pipeline/client.py
      --- a/pipeline/client.py
      +++ b/pipeline/client.py
      @@ -5,7 +5,8 @@ import requests
   
       class UpstreamClient:
           BASE_URL = "https://etl.internal/api"
      +    API_TOKEN = "sk-etl-9f8e7d6c5b4a"
      
       def fetch(self, path: str) -> dict:
           return requests.get(
    expect:
      verdict: request_changes
      must_find:
        - file: pipeline/client.py
          kind: hardcoded-secret
          severity: high

  - id: py-002
    repo: acme/etl-pipeline
    title: 裸 except 吞掉全部异常继续执行
    label: standard
    source: 自编写合成夹具（现实形态 Python diff）
    diff: |
      diff --git a/pipeline/loader.py b/pipeline/loader.py
      --- a/pipeline/loader.py
      +++ b/pipeline/loader.py
      @@ -18,8 +18,8 @@ def load_batch(rows: list[dict]) -> int:
           loaded = 0
           for row in rows:
               try:
                   upsert(row)
                   loaded += 1
      -        except Exception as e:
      -            logger.error("upsert failed: %s", e)
      +        except Exception:
      +            pass
           return loaded
    expect:
      verdict: request_changes
      must_find:
        - file: pipeline/loader.py
          kind: error-swallow
          severity: medium

  - id: py-003
    repo: acme/billing-api
    title: f-string 拼接 SQL 新增查询（注入面）
    label: known_miss
    source: 自编写合成夹具（现实形态 Python diff）
    diff: |
      diff --git a/billing/queries.py b/billing/queries.py
      --- a/billing/queries.py
      +++ b/billing/queries.py
      @@ -24,6 +24,12 @@ def list_invoices(conn, status: str) -> list:
           return conn.execute(sql, (status,)).fetchall()
      
      +def search_invoices(conn, keyword: str) -> list:
      +    sql = f"SELECT * FROM invoices WHERE memo LIKE '%{keyword}%'"
      +    return conn.execute(sql).fetchall()
      +
       def invoice_count(conn) -> int:
           return conn.execute("SELECT count(*) FROM invoices").fetchone()[0]
    expect:
      verdict: request_changes
      must_find:
        - file: billing/queries.py
          kind: sql-inject
          severity: high

  - id: py-004
    repo: acme/billing-api
    title: 打开文件未关闭（资源泄漏）
    label: known_miss
    source: 自编写合成夹具（现实形态 Python diff）
    diff: |
      diff --git a/billing/export.py b/billing/export.py
      --- a/billing/export.py
      +++ b/billing/export.py
      @@ -9,7 +9,6 @@ def export_csv(path: str, rows: list[tuple]) -> None:
      -    with open(path, "w", newline="") as f:
      -        writer = csv.writer(f)
      -        writer.writerows(rows)
      +    f = open(path, "w", newline="")
      +    csv.writer(f).writerows(rows)
       # 文件句柄交由 GC 关闭
    expect:
      verdict: request_changes
      must_find:
        - file: billing/export.py
          kind: resource-leak
          severity: medium

  - id: py-005
    repo: acme/ml-serving
    title: 补类型注解与 docstring（干净改进）
    label: known_fp
    source: 自编写合成夹具（现实形态 Python diff；误报正例=干净 diff）
    diff: |
      diff --git a/serving/preprocess.py b/serving/preprocess.py
      --- a/serving/preprocess.py
      +++ b/serving/preprocess.py
      @@ -3,8 +3,10 @@ import numpy as np
   
      -def normalize(x):
      +def normalize(x: np.ndarray) -> np.ndarray:
      +    """按 min-max 归一化到 [0, 1]。"""
           lo, hi = x.min(), x.max()
           if hi == lo:
               return np.zeros_like(x)
           return (x - lo) / (hi - lo)
    expect:
      verdict: approve
