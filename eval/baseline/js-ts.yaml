# JS-TS 语言审查基准（P3-03 #28 起步集）。
#
# 出处口径（诚实标注，禁止把合成夹具说成现网已裁决 MR）：
#   - 本文件全部样例为**合成夹具**：自行编写的现实形态 JS/TS diff（常见缺陷模式）；
#     现网在役仓的已裁决 MR 样例落地前，本文件不冒充现网数据。
#   - 标签口径与 go.yaml 同：known_miss/known_fp 是预设形态（结构约束由
#     LoadDir.Validate 硬校验），「历史模型漏报/误报」的实证归现网样例回填。
#
# kind 词表与真实模型评测协议（test/evalq/real_model_test.go）同闭集；匹配规则
# （kind 主键、file 可选收窄）见 docs/eval-baseline.md。
language: js-ts
description: JS/TS 语言审查基准（合成夹具起步集：常见缺陷模式自编写，非现网 MR）
cases:
  - id: js-001
    repo: acme/web-console
    title: 密钥拼进前端请求头
    label: standard
    source: 自编写合成夹具（现实形态 JS diff）
    diff: |
      diff --git a/src/api/client.ts b/src/api/client.ts
      --- a/src/api/client.ts
      +++ b/src/api/client.ts
      @@ -8,6 +8,7 @@ export async function get(path: string): Promise<unknown> {
         const res = await fetch(API_BASE + path, {
           headers: {
             "Content-Type": "application/json",
      +      "X-Api-Key": "ak-live-3c2b1a0f",
           },
         });
         return res.json();
    expect:
      verdict: request_changes
      must_find:
        - file: src/api/client.ts
          kind: hardcoded-secret
          severity: high

  - id: js-002
    repo: acme/web-console
    title: JSON.parse 无容错且异常被吞
    label: standard
    source: 自编写合成夹具（现实形态 JS diff）
    diff: |
      diff --git a/src/utils/cache.ts b/src/utils/cache.ts
      --- a/src/utils/cache.ts
      +++ b/src/utils/cache.ts
      @@ -12,7 +12,9 @@ export function readCache(key: string): unknown {
         try {
           const raw = localStorage.getItem(key);
      -    return JSON.parse(raw ?? "{}");
      +    const data = JSON.parse(raw);
      +    return data;
         } catch {
      +    // 解析失败当作未命中
           return null;
         }
       }
    expect:
      verdict: comment
      must_find:
        - file: src/utils/cache.ts
          kind: error-swallow
          severity: medium

  - id: js-003
    repo: acme/web-console
    title: 循环内 addEventListener 泄漏未解绑
    label: known_miss
    source: 自编写合成夹具（现实形态 JS diff）
    diff: |
      diff --git a/src/components/DataTable.ts b/src/components/DataTable.ts
      --- a/src/components/DataTable.ts
      +++ b/src/components/DataTable.ts
      @@ -31,6 +31,10 @@ export function mountTable(el: HTMLElement, rows: Row[]) {
         for (const row of rows) {
           const tr = document.createElement("tr");
      +    tr.addEventListener("click", () => {
      +      select(row);
      +    });
           tr.textContent = row.label;
           el.appendChild(tr);
         }
    expect:
      verdict: comment
      must_find:
        - file: src/components/DataTable.ts
          kind: resource-leak
          severity: low

  - id: js-004
    repo: acme/billing-web
    title: eval 执行动态表达式（新增注入面）
    label: standard
    source: 自编写合成夹具（现实形态 JS diff）
    diff: |
      diff --git a/src/pages/calc.ts b/src/pages/calc.ts
      --- a/src/pages/calc.ts
      +++ b/src/pages/calc.ts
      @@ -6,6 +6,10 @@ export function evaluateRule(rule: string, ctx: Record<string, number>) {
         return Function(...Object.keys(ctx), `return ${rule}`)(...Object.values(ctx));
       }
      
      +export function evaluatePreset(expr: string): number {
      +  // expr 来自用户配置的公式预设
      +  return eval(expr);
      +}
       export function round2(n: number): number {
         return Math.round(n * 100) / 100;
       }
    expect:
      verdict: request_changes
      must_find:
        - file: src/pages/calc.ts
          kind: eval-injection
          severity: high

  - id: js-005
    repo: acme/billing-web
    title: 金额计算补类型收窄（干净改进）
    label: known_fp
    source: 自编写合成夹具（现实形态 TS diff；误报正例=干净 diff）
    diff: |
      diff --git a/src/money.ts b/src/money.ts
      --- a/src/money.ts
      +++ b/src/money.ts
      @@ -4,8 +4,9 @@ export interface Money {
         currency: string;
       }
      
      -export function add(a: Money, b: Money): Money {
      +export function add(a: Money, b: Money): Money {
      +  assertSameCurrency(a, b);
         return { amountCents: a.amountCents + b.amountCents, currency: a.currency };
       }
    expect:
      verdict: approve
