# 场景（v11 扩容）：R3 失效降级——完成度判定两次（原轮 + 解析失败重试轮）均
# 不可解析 → 全部 AC 置 unverifiable（Summary「R3 判定失败…已全部降级为需人工
# 确认」）→ R5.3 COMMENT，结果不丢。降级语义由 TestCheckComplianceDegraded
# 单测钉 Summary/Detail；本夹具钉端到端编排（harness garble_r3 开关驱动）。
name: 53-r3-degraded-comment
# 真实模式跳过：R3 恒垃圾是打桩前提，真实模型不会复现（同 25/48）
skip_real: true
garble_r3: true
scenario: [guard]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #53
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
repo_files:
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
stub:
  r1: |
    {"source":"issue #53","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  reviewer: |
    {"findings":[],"notes":""}
expect:
  verdict: comment
  # 降级报告 unverifiable>0 → R5.3（unverifiable 与逐 AC 状态入报告可断言；
  # 降级 Summary 不入报告渲染面，由单测断言）
  must_find: ["R5.3", "unverifiable"]
  must_not_find: ["R5.5"]
