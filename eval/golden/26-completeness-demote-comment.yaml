# 场景：G4 完备性裁判（demote 降级门）——同 25 的失败形态，demote 策略下
# APPROVE 被降级为 COMMENT（rule=R5.C）：部分覆盖不允许白给通过。
name: 26-completeness-demote-comment
# 真实模式跳过：同 25（demote 降级门语义由桩模式固化）
skip_real: true
scenario: [guard, complete]
kind: 0
completeness_policy: demote
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,5 @@
       package main
      +
      +func login() {}
    additions: 2
repo_files:
  main.go: |
    package main

    func login() {}
extra_agents:
  - name: doomed
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
persona_seq:
  "【Argus doomed】":
    - 'not-json-garbage'
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
expect:
  verdict: comment
  must_find: ["完备性检查", "R5.C"]
  must_not_find: ["R5.5"]
