# 场景：scope creep（需求外改动）→ R5.3 COMMENT 人工确认
name: 03-scope-creep-comment
scenario: [scope-creep]
kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,5 @@
       package main
      +
      +func login() {}
    additions: 2
  - path: extra.go
    diff: |
      diff --git a/extra.go b/extra.go
      --- /dev/null
      +++ b/extra.go
      @@ -0,0 +1,2 @@
      +package main
      +
    additions: 2
repo_files:
  main.go: |
    package main

    func login() {}
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[{"file":"extra.go","note":"与本需求无关的重构"}],"summary":"完成但有夹带"}
expect:
  verdict: comment
  must_find: ["需求外改动", "extra.go", "R5.3"]
