pr:
  title: 添加 clamp 函数
  body: |
    在 web/util.js 提供 clamp(v, lo, hi) 函数，返回限定在 [lo, hi] 区间内的数值。见 issue #54
changed_files:
  - path: web/util.js
    diff: |
      diff --git a/web/util.js b/web/util.js
      --- /dev/null
      +++ b/web/util.js
      @@ -0,0 +1,6 @@
      +function clamp(v, lo, hi) {
      +  if (v < lo) return lo
      +  if (v > hi) return hi
      +  return v
      +}
      +module.exports = { clamp }
    additions: 6
repo_files:
  web/util.js: |
    function clamp(v, lo, hi) {
      if (v < lo) return lo
      if (v > hi) return hi
      return v
    }
    module.exports = { clamp }
