name: 10-low-finding-comment
scenario: [code-review]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
repo_files:
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":3,"severity":"low","comment":"导出函数缺少 doc comment"}],"notes":""}
expect:
  verdict: comment
  real_verdicts: [comment, approve]
  must_find: ["R5.4"]
