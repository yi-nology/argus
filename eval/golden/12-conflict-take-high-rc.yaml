# 场景：两专家同位置冲突（medium vs high）→ severity 取高 → R5.2
name: 12-conflict-take-high-rc
# 真实模式跳过：冲突前提依赖 style canned high 意见
skip_real: true
scenario: [merge, code-review]
kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +var cache map[string]int
      +
      +func set(k string, v int) { cache[k] = v }
    additions: 4
repo_files:
  main.go: |
    package main

    var cache map[string]int

    func set(k string, v int) { cache[k] = v }
extra_agents:
  - name: style
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
persona_seq:
  "【Argus style】":
    - '{"findings":[{"file":"main.go","line":5,"severity":"high","comment":"并发写共享 map 未加锁，生产环境会触发 data race"}],"notes":""}'
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":5,"severity":"medium","comment":"并发写共享 map 未加锁"}],"notes":""}
expect:
  verdict: request_changes
  must_find: ["R5.2"]
