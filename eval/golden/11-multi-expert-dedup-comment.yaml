# 场景：两个专家报同一问题 → 指纹去重为一条，by 拼接（correctness,style）
name: 11-multi-expert-dedup-comment
# 真实模式跳过：style 专家为 canned persona，真实模型不复现该前提
skip_real: true
scenario: [merge]
kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +var cache map[string]int
      +
      +func set(k string, v int) { cache[k] = v }
    additions: 4
repo_files:
  main.go: |
    package main

    var cache map[string]int

    func set(k string, v int) { cache[k] = v }
extra_agents:
  - name: style
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
persona_seq:
  "【Argus style】":
    - '{"findings":[{"file":"main.go","line":5,"severity":"medium","comment":"并发写共享 map 未加锁"}],"notes":""}'
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":5,"severity":"medium","comment":"并发写共享 map 未加锁"}],"notes":""}
expect:
  verdict: comment
  must_find: ["correctness,style", "R5.4"]
