# 场景（v10 扩容）：best-of-N 部分采样失败降级——3 采样中 1 份失败（garbage），
# 成功 2 份报同一 low 意见 → 复现 2/3 标注 + 确定性升级（low→medium）→ R5.4，
# 且「[审查降级] best-of-N：2/3 采样成功」注记随 Result.Notes 透出为报告降级段
#（部分成功照常产结果，不整单失败——与 45 号的全采样成功形态互补）。
name: 51-reviewn-partial-degraded
scenario: [best-of-n, code-review]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #51
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
repo_files:
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
extra_agents:
  - name: deep-review
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
    reviewN: 3
persona_seq:
  # 三份并发采样按序消费槽位 0/1/2；拿到槽位 2（garbage）的采样其内部回喂重试
  #（agentrun，v3.24.0 教训）再消费槽位 3 → 钳制回 2 仍 garbage → 该采样失败。
  # 恰好 k=2、两份成功采样同一 low 意见（复现 2/3）——计数确定，具体哪份失败
  # 不影响聚合结果。garbage 放中段会被重试"救活"（消费掉后面的 valid 槽位）。
  "【Argus deep-review】":
    - '{"findings":[{"file":"main.go","line":3,"severity":"low","comment":"Add 缺少 doc comment"}],"notes":""}'
    - '{"findings":[{"file":"main.go","line":3,"severity":"low","comment":"Add 缺少 doc comment"}],"notes":""}'
    - 'not-json-garbage'
stub:
  r1: |
    {"source":"issue #51","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[],"notes":""}
expect:
  verdict: comment
  # 升级后 medium 由复现驱动（确定性）；降级注记钉「部分成功不整单失败」。
  # 真实模式三采样全成功（k=3，无降级注记），意见产出不可控 → [approve, comment]
  real_verdicts: [approve, comment]
  must_find: ["采样复现 2/3", "2/3 采样成功", "R5.4"]
