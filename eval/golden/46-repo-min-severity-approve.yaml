# 场景（v9 扩容）：仓库主权配置 review.min_severity（v3.15.0 P0-2）首次入册——
# 仓库声明 low 意见不进报告与裁决，低于阈值的意见被确定性剔除并降级注明，
# 零意见落 R5.5 approve。high 任何合法阈值下都保留（redline 由 42/08 家族钉住）。
name: 46-repo-min-severity-approve
scenario: [repo-config, code-review]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #46
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
repo_files:
  .reviewagents.yaml: |
    review:
      min_severity: medium
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
stub:
  r1: |
    {"source":"issue #46","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":3,"severity":"low","comment":"Add 缺少 doc comment"}],"notes":""}
expect:
  verdict: approve
  # 真实模式：real reviewer 报 low/无意见 → 剔除后 approve；报 medium+ →
  # R5.4 comment（仓库阈值真实生效的另一种诚实落点）；clean Add 上 HIGH →
  # rc 属过严 miss 信号
  real_verdicts: [approve, comment]
  must_find: ["低于阈值的意见未纳入"]
