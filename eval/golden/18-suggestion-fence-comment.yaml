kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录：提供 login(password) 校验函数，空口令报错。见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,10 @@
       package main
      +
      +import "errors"
      +
      +func login(password string) error {
      +	if password == "" {
      +		return errors.New("empty password")
      +	}
      +	return nil
      +}
    additions: 8
repo_files:
  main.go: |
    package main

    import "errors"

    func login(password string) error {
    	if password == "" {
    		return errors.New("empty password")
    	}
    	return nil
    }
