# 场景：code_review 任务（无需求清单，RunReviewOnly 路径）无意见 → R5.5 APPROVE
name: 19-review-only-clean-approve
scenario: [complete, code-review]
kind: 1
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,5 @@
       package main
      +
      +func login() {}
    additions: 2
repo_files:
  main.go: |
    package main

    func login() {}
expect:
  verdict: approve
  must_find: ["R5.5"]
