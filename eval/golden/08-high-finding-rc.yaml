# 场景：审查专家报 high 意见（带 file:line 证据）→ R5.2 REQUEST_CHANGES + 行内评论
name: 08-high-finding-rc
scenario: [code-review]
kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func login(password string) bool {
      +	return password == "hardcoded-secret"
      +}
    additions: 3
repo_files:
  main.go: |
    package main

    func login(password string) bool {
    	return password == "hardcoded-secret"
    }
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":4,"severity":"high","comment":"口令硬编码在源码中，属于敏感信息泄漏"}],"notes":""}
expect:
  verdict: request_changes
  must_find: ["R5.2", "口令硬编码"]
