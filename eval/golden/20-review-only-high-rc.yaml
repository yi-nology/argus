# 场景：code_review 任务 + high 意见 → R5.2（review-only 路径的一票否决）
name: 20-review-only-high-rc
scenario: [code-review]
kind: 1
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func login(password string) bool {
      +	return password == "hardcoded-secret"
      +}
    additions: 3
repo_files:
  main.go: |
    package main

    func login(password string) bool {
    	return password == "hardcoded-secret"
    }
stub:
  reviewer: |
    {"findings":[{"file":"main.go","line":4,"severity":"high","comment":"口令硬编码在源码中"}],"notes":""}
expect:
  verdict: request_changes
  must_find: ["R5.2"]
