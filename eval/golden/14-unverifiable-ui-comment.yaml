# 场景：多语言 UI 类 AC 无法在代码层验证 → unverifiable → R5.3 人工确认
# v3 标定：需求句精确收窄（切换 UI 明示不在范围）——消灭「诚实 R3 判切换交互
# 缺失 → partial → R5.1 rc」的夹具自身噪声；真实模式 {comment, approve}（R3 判
# unverifiable 或 implemented 均诚实），rc = 过严 miss 信号。
name: 14-unverifiable-ui-comment
scenario: [unverifiable, multilingual]
kind: 0
pr:
  title: 登录页多语言
  body: |
    提供前端中英文案字典与取词函数 t(lang,key)，语言切换 UI 交互不在本次范围。见 issue #12
changed_files:
  - path: web/app.js
    diff: |
      diff --git a/web/app.js b/web/app.js
      --- a/web/app.js
      +++ b/web/app.js
      @@ -1,2 +1,11 @@
       const app = {}
      +const messages = {
      +  zh: {login: "登录", logout: "退出"},
      +  en: {login: "Login", logout: "Logout"}
      +}
      +function t(lang, key) {
      +  const dict = messages[lang] || messages.en
      +  return dict[key] || messages.en[key] || key
      +}
      +app.t = t
    additions: 9
repo_files:
  web/app.js: |
    const app = {}
    const messages = {
      zh: {login: "登录", logout: "退出"},
      en: {login: "Login", logout: "Logout"}
    }
    function t(lang, key) {
      const dict = messages[lang] || messages.en
      return dict[key] || messages.en[key] || key
    }
    app.t = t
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"提供中英文案字典与取词函数 t(lang,key)"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"unverifiable","detail":"文案渲染与实际取词效果无法在代码静态审查中验证，需要预览环境人工确认"}],"scope_creep":[],"summary":"无法完全验证"}
expect:
  verdict: comment
  # v3：rc 不入集合——需求已精确收窄到代码实际内容，诚实 R3 只会判
  # implemented（→ approve）或 unverifiable（→ comment），rc 属过严信号
  real_verdicts: [comment, approve]
  must_find: ["R5.3", "unverifiable"]
