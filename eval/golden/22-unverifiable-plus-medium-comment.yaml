repo_files:
  web/app.js: |
    const app = {}
    const messages = {
      zh: {login: "登录", logout: "退出"},
      en: {login: "Login", logout: "Logout"}
    }
    function t(lang, key) {
      const dict = messages[lang] || messages.en
      return dict[key] || messages.en[key] || key
    }
    app.t = t
