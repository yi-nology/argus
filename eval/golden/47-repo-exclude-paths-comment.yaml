# 场景（v9 扩容）：仓库主权配置 review.exclude_paths（v3.15.0 P0-2）首次入册——
# 生成物被排除出 diff 文本（不进审查视野），打桩 reviewer 对排除文件报的 high
# 经 v3.8.0 scope 闸门降为 COMMENT 级并注明（排除文件的缺陷不驱动一票否决）。
name: 47-repo-exclude-paths-comment
scenario: [repo-config, scope-gate]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #47
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
  - path: gen/schema.gen.go
    diff: |
      diff --git a/gen/schema.gen.go b/gen/schema.gen.go
      --- /dev/null
      +++ b/gen/schema.gen.go
      @@ -0,0 +1,5 @@
      +package gen
      +
      +// Code generated by schema-tool. DO NOT EDIT.
      +
      +var apiToken = "sk-hardcoded-secret-token"
    additions: 5
repo_files:
  .reviewagents.yaml: |
    review:
      exclude_paths: ["*.gen.go"]
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
stub:
  r1: |
    {"source":"issue #47","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"gen/schema.gen.go","line":5,"severity":"high","comment":"生成文件中疑似硬编码令牌"}],"notes":""}
expect:
  verdict: comment
  # 排除文件不进 diff → scope 闸门判越界 → high 降 COMMENT 级；must_not_find
  # 钉住「排除文件的意见不驱动 R5.2」。真实模式 reviewer 只看得到 main.go：
  # 无意见 → approve、非阻塞意见 → comment（[approve, comment] 同 42 家族）
  real_verdicts: [approve, comment]
  must_find: ["未计入高危裁决"]
  must_not_find: ["R5.2"]
