# 场景（v12 扩容）：互盲编队交叉审查标注首次入册——两名成员对同一 diff 报出
# 不同文件的意见，互未复现 → 各打「编队另一专家未复现此问题，请优先人工复核」
# 降权标注 + CrossReview 汇总行。注意 replicated 判定是「同文件 ±5 行内互现」——
# 异文件意见恒为未复现（首轮误把两意见放同文件 6/9 行、相距 3 行被判互现）。
name: 56-squad-crossreview-comment
scenario: [squad, code-review]
kind: 0
pr:
  title: 添加 Add 与 Join
  body: |
    在 main 包提供 Add(a, b int) int，在 util 包提供 Join(parts []string) string（逗号连接）。见 issue #56
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,7 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
      +
       func main() {}
    additions: 5
  - path: util/join.go
    diff: |
      diff --git a/util/join.go b/util/join.go
      --- /dev/null
      +++ b/util/join.go
      @@ -0,0 +1,5 @@
      +package util
      +
      +import "strings"
      +
      +func Join(parts []string) string { return strings.Join(parts, ",") }
    additions: 5
repo_files:
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }

    func main() {}
  util/join.go: |
    package util

    import "strings"

    func Join(parts []string) string { return strings.Join(parts, ",") }
extra_agents:
  - name: gamma
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
  - name: delta
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
extra_squads:
  - name: pair-blind
    paths: ["*.go"]
    members: [gamma, delta]
persona_seq:
  "【Argus gamma】":
    - '{"findings":[{"file":"main.go","line":3,"severity":"medium","comment":"Add 缺少 doc comment"}],"notes":""}'
  "【Argus delta】":
    - '{"findings":[{"file":"util/join.go","line":5,"severity":"medium","comment":"Join 分隔符未参数化"}],"notes":""}'
stub:
  r1: |
    {"source":"issue #56","acceptance_criteria":[{"id":"AC-1","text":"在 main 包提供 Add(a, b int) int 返回两数之和"},{"id":"AC-2","text":"在 util 包提供 Join(parts []string) string 逗号连接"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"},{"id":"AC-2","status":"implemented","evidence":"util/join.go:5"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[],"notes":""}
expect:
  verdict: comment
  # 两条意见异文件互未复现 → 各打未复现标注 + 汇总行；R5.4 comment。
  # 真实模式成员意见产出不可控 → [approve, comment] 诚实放宽
  real_verdicts: [approve, comment]
  must_find: ["编队另一专家未复现", "交叉审查", "R5.4"]
