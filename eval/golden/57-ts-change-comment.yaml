name: 57-ts-change-comment
scenario: [polyglot, code-review]
kind: 0
pr:
  title: 添加 clampTs 函数
  body: |
    在 web/util.ts 提供 clampTs(v: number, lo: number, hi: number): number 函数，返回限定在 [lo, hi] 区间内的数值。见 issue #57
changed_files:
  - path: web/util.ts
    diff: |
      diff --git a/web/util.ts b/web/util.ts
      --- /dev/null
      +++ b/web/util.ts
      @@ -0,0 +1,6 @@
      +export function clampTs(v: number, lo: number, hi: number): number {
      +  if (v < lo) return lo
      +  if (v > hi) return hi
      +  return v
      +}
    additions: 5
repo_files:
  web/util.ts: |
    export function clampTs(v: number, lo: number, hi: number): number {
      if (v < lo) return lo
      if (v > hi) return hi
      return v
    }
