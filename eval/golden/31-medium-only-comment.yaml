# 场景（v3，P1-6 北极星，边界标定）：medium-only 意见 → R5.4 COMMENT
# comment/rc 方向系统性过严的标定夹具：实现完整、仅两条 medium 非阻塞意见，
# 无 high/需求缺口——真实模式绝不允许升 rc。v4 标定两点：
# ① toy login 换 Add 无安全面实现——安全噪声不再污染「非阻塞意见是否被过严
#    升级」的标定信号；
# ② real 集合收敛为 [approve, comment]（与 27 号同款语义）：锚点钉的是「rc 不
#    上移」（危险方向），approve 对 clean 代码不构成危险——v4 首轮真实 reviewer
#    对干净 Add 产出 0 意见自然落 R5.5，属诚实落点非失守。
name: 31-medium-only-comment
scenario: [boundary]
kind: 0
pr:
  title: 添加 Add 函数
  body: |
    在 main 包实现 Add(a, b int) int，返回两数之和。见 issue #12
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"提供 Add(a, b int) int 返回两数之和"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
  reviewer: |
    {"findings":[{"file":"main.go","line":3,"severity":"medium","comment":"导出函数缺少 doc comment"},{"file":"main.go","line":4,"severity":"medium","comment":"整数溢出行为建议补充注释说明"}],"notes":""}
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,6 @@
       package main
      +
      +func Add(a, b int) int {
      +	return a + b
      +}
    additions: 4
repo_files:
  main.go: |
    package main

    func Add(a, b int) int {
    	return a + b
    }
expect:
  verdict: comment
  real_verdicts: [comment, approve]
  must_find: ["R5.4"]
