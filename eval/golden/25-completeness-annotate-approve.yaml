# 场景：G4 完备性裁判（annotate 默认策略）——一个插件执行失败、其余正常：
# 报告出现独立「完备性检查」段点名失败插件；verdict 不受影响（annotate 只注明）。
name: 25-completeness-annotate-approve
# 真实模式跳过：doomed 插件依赖 garbage 响应，真实模型不会失败
skip_real: true
scenario: [guard, complete]
kind: 0
pr:
  title: 添加登录功能
  body: |
    实现账号密码登录，见 issue #12
changed_files:
  - path: main.go
    diff: |
      diff --git a/main.go b/main.go
      --- a/main.go
      +++ b/main.go
      @@ -1,3 +1,5 @@
       package main
      +
      +func login() {}
    additions: 2
repo_files:
  main.go: |
    package main

    func login() {}
extra_agents:
  - name: doomed
    kind: builtin
    skills: [code-review]
    needs: [diff]
    cost: standard
    timeout: 60s
persona_seq:
  "【Argus doomed】":
    - 'not-json-garbage'
stub:
  r1: |
    {"source":"issue #12","acceptance_criteria":[{"id":"AC-1","text":"支持账号密码登录"}],"ambiguous":[]}
  r3: |
    {"checks":[{"id":"AC-1","status":"implemented","evidence":"main.go:3"}],"scope_creep":[],"summary":"完成"}
expect:
  verdict: approve
  must_find: ["完备性检查", "doomed"]
  must_not_find: ["R5.C"]
